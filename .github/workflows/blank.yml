name: Free RDP
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Enable RDP and create user
        shell: powershell
        run: |
          $pass = "Rdp@12345"
          net user rdpuser $pass /add
          net localgroup "Remote Desktop Users" rdpuser /add
          net localgroup Administrators rdpuser /add
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Write-Host "USERNAME: rdpuser"
          Write-Host "PASSWORD: $pass"
      - name: Download and start ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath C:\ngrok
          C:\ngrok\ngrok.exe config add-authtoken "${env:NGROK_AUTHTOKEN}"
          Start-Process -FilePath "C:\ngrok\ngrok.exe" -ArgumentList "tcp","3389" -WindowStyle Hidden
          Start-Sleep -Seconds 12
          $t = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          Write-Host ("RDP_ADDRESS: " + $t.tunnels[0].public_url -replace 'tcp://','')
      - name: Keep tunnel alive
        shell: powershell
        run: |
          $end = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 300 }
